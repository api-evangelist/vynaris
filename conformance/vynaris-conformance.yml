- id: rfc6750
  name: OAuth 2.0 Bearer Token Usage (Authorization header form only)
  conforms: partial
  category: security
  evidence: >-
    Credentials are presented as `Authorization: Bearer vyn_sk_live_...`, which
    is the RFC 6750 header form, but the token is a long-lived opaque API key,
    not an OAuth 2.0 access token. There is no authorization server, no token
    endpoint and no scopes.
  evidence_url: https://vynaris.com/docs#quickstart
