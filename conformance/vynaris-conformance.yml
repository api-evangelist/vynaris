data_governance:
  training_on_customer_content: >-
    "Vynaris does not train models on your prompt or completion content." A
    third-party provider may, only for keys where the user explicitly enables
    provider data collection.
  default_posture: each API key starts metadata-only, excluding deployments marked as potentially retaining or using content
  hosted_model_exception: >-
    For the three Vynaris-hosted reduced-refusal model IDs, prompt and output
    bodies are never persisted, and this overrides the key's transcript-capture
    setting. Only billing, reliability, account and security metadata is kept.
  data_residency: US servers for account and request metadata; upstream providers process prompts wherever they operate; region is not constrainable per key
  subprocessors_named:
  - Mixpanel (product and website analytics)
  - X (conversion measurement for the provider's own ads)
  - Not Diamond (routing-evaluation comparison, opted-in keys only)
  - an unnamed merchant-of-record payment partner
  source: https://vynaris.com/privacy
