conformance:
- id: openai-chat-completions
  name: OpenAI Chat Completions wire format
  conforms: true
  category: domain-standard
  evidence: >-
    "Vynaris is an OpenAI-compatible chat completions gateway at
    https://api.vynaris.com/v1. Swap the base URL in whatever client you
    already use, keep your prompts and tool definitions." The docs ship
    working snippets for the official OpenAI Python and TypeScript SDKs
    constructed with base_url/baseURL overrides only, plus Cursor, OpenClaw and
    Pi configs that declare api: "openai-completions".
  evidence_url: https://vynaris.com/docs#quickstart
  note: >-
    This is the de-facto interface standard of the LLM gateway/router market
    and it is the whole product thesis here - the provider states that leaving
    is "a one-line base_url change back to any provider", i.e. conformance is
    marketed as the anti-lock-in guarantee. Extension beyond the standard: a
    non-standard top-level `vynaris` object is added to the response body
    alongside the standard OpenAI fields, and a `model` value of "auto" is
    accepted where the standard expects a concrete model id.
- id: anthropic-messages
  name: Anthropic Messages API wire format
  conforms: partial
  category: domain-standard
  evidence: >-
    The Anthropic Python SDK is documented to work against
    base_url=https://api.vynaris.com with auth_token, and Claude Code is
    configured via ANTHROPIC_BASE_URL/ANTHROPIC_AUTH_TOKEN. But the provider
    states plainly, in both the docs and agents.md, that native /v1/messages is
    "not yet implemented (the Anthropic Python SDK works via base_url; raw
    /v1/messages calls do not)", and tells the reader to treat the Claude Code
    setup as "environment setup for future compatibility rather than a
    guarantee that every Claude Code call is served today".
  evidence_url: https://vynaris.com/docs#anthropic-python
  note: >-
    Recorded as partial with the provider's own caveat rather than as a claim,
    because the marketing line ("OpenAI-compatible and
    Anthropic-SDK-compatible") is broader than the documented behavior.
