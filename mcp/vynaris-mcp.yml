finding: >-
  Vynaris publishes NO MCP server, hosted or local. This is notable because the
  provider is otherwise unusually agent-forward - it ships llms.txt, an
  agents.md operations manual, programmatic self-onboarding, and a
  machine-readable cost receipt on every response - yet the one surface an MCP
  client could connect to does not exist. The tools below are a DERIVED
  candidate set from the six REST endpoints the provider documents in prose;
  nobody ships them.
probes:
- url: https://api.vynaris.com/mcp
  method: POST tools/list
  status: 404
