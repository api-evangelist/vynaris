finding: >-
  Vynaris publishes NO first-party client library in any language, and no
  first-party CLI. This is a design position rather than a gap: the product is
  a drop-in OpenAI-compatible endpoint, and the documented integration path for
  all seven harnesses is to keep the client the caller already has and change
  base_url. The docs never offer an SDK to install.
