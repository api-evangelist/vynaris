    registry: pypi
    official: false
    owner: OpenAI
    usage: OpenAI(base_url="https://api.vynaris.com/v1", api_key="vyn_sk_live_...")
  - name: openai (TypeScript)
    registry: npm
    official: false
    owner: OpenAI
    usage: 'new OpenAI({ baseURL: "https://api.vynaris.com/v1", apiKey: "vyn_sk_live_..." })'
  - name: anthropic (Python)
    registry: pypi
    official: false
    owner: Anthropic
    usage: anthropic.Anthropic(base_url="https://api.vynaris.com", auth_token="vyn_sk_live_...")
